exporters:
  otlp_grpc/2:
    endpoint: ${env:MW_TARGET}
processors:
  batch:
    timeout: 10s
  resource/host_tags:
    attributes:
    - action: insert
      key: mw.host.tags
      value: env:prod,team:core
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:9319
  postgresql:
    collection_interval: 60s
    databases:
    - app
    endpoint: db.example.com:5432
    password: pg-secret
    tls:
      insecure: true
    username: mw
service:
  pipelines:
    metrics:
      exporters:
      - otlp_grpc/2
      processors:
      - resource/host_tags
      - batch
      receivers:
      - otlp
      - postgresql
